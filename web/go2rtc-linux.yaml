# Linux host proxy. Install ffmpeg and go2rtc on the Linux computer.
# Replace the camera address with the reCamera Pro address on your LAN.
api:
  listen: "127.0.0.1:1986"
rtsp:
  listen: ""
webrtc:
  listen: ":8557"
  candidates:
    - 192.168.3.151:8557
streams:
  qr: "exec:ffmpeg -hide_banner -loglevel error -i http://192.168.42.1:8766/video.mjpg -an -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p -b:v 1200k -f h264 -"
