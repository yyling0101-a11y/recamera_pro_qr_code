worker_processes 1;
pid /tmp/qr-nginx.pid;
error_log /tmp/qr-nginx-error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/qr-nginx-access.log;
    sendfile on;
    server {
        listen 18888;
        server_name _;
        root /home/yylin/recamera_pro/qr_code/web;
        index index.html;
        location = /api/ws {
            if ($arg_src != "qr") { return 403; }
            proxy_pass http://127.0.0.1:1986/api/ws;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location = /stream.html { proxy_pass http://127.0.0.1:1986/stream.html; }
        location = /video-stream.js { proxy_pass http://127.0.0.1:1986/video-stream.js; }
        location = /video-rtc.js { proxy_pass http://127.0.0.1:1986/video-rtc.js; }
        location = /video-stream.css { proxy_pass http://127.0.0.1:1986/video-stream.css; }
        location = /ws {
            proxy_pass http://192.168.3.207:8766/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
